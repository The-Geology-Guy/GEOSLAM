[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GEOSLAM"
dynamic = ["version"]
description = "Seismo-Lineament Analysis Method (SLAM) in Python: project earthquake nodal planes and their uncertainty to the ground surface."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Luke Pajer"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "contourpy>=1.0",
  "requests>=2.28",
  "tifffile>=2023.1",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
gis = ["rasterio>=1.3", "pyproj>=3.5"]
tables = ["pandas>=2.0", "openpyxl"]
test = ["pytest>=7"]
all = ["rasterio>=1.3", "pyproj>=3.5", "pandas>=2.0", "openpyxl", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/The-Geology-Guy/GEOSLAM"
"SLAM (Cronin)" = "https://croninprojects.org/Vince/SLAM/"

[project.scripts]
geoslam = "geoslam.cli:main"

[tool.setuptools.dynamic]
version = {attr = "geoslam.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call live web services"]
